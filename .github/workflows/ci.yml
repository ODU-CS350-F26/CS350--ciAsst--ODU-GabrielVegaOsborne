    name: CI - build and test

    on:                                
      push:
        branches: [ main ]

    jobs:
      build:                           

        runs-on: ubuntu-latest         

        steps:    
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - name: Set up JDK 17
          uses: actions/setup-java@v2        
          with:
            java-version: '17'
            distribution: 'adopt'
        - name: Grant execute permission for gradlew
          run: chmod +x gradlew              
        - name: Build and test
          run: | 
            gradle build
            gradle test
            gradle reports
            gradle deployReports